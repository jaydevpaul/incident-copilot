[project]
name = "incident-copilot"
version = "0.1.0"
description = "AI on-call engineer that finds root cause of failures in a distributed systems"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv]
package=false

[tool.uv.workspace]
members = []

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]


[tool.ruff]
line-length=100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]